name: Deploy backend

on:
  push:
    branches:
      - main

concurrency:
  group: task-backend-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # 用真实 Postgres 跑集成测试，确保持久化逻辑在部署前已被验证
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://taskuser:ci-only-password@127.0.0.1:5432/taskdb

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify application import
        run: python -c "from main import app"

      - name: Run integration tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t task-backend:test .

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload project files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "Dockerfile,compose.yml,main.py,db.py,requirements.txt,.dockerignore"
          target: "/opt/task-backend"
          overwrite: true

      - name: Build and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/task-backend
            touch .env
            # 首次部署生成随机数据库密码并固化到 .env，后续部署复用同一个
            # 注意：密码在 Postgres 数据卷初始化时写入，之后不要手改
            if ! grep -q '^POSTGRES_PASSWORD=' .env; then
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
              echo "POSTGRES_PASSWORD generated for first deploy"
            fi
            chmod 600 .env
            # --wait：由 compose 的健康检查判定就绪，失败时打印日志便于定位
            if ! docker compose up -d --build --remove-orphans --wait --wait-timeout 180; then
              echo "::error::服务未能进入健康状态"
              docker compose ps
              docker compose logs --tail 100
              exit 1
            fi
            # 从宿主再确认一次端口映射可用。不依赖 curl 的 --retry-all-errors，
            # 老版本 curl 不支持，且 --retry 不会重试 connection reset
            ok=0
            for _ in $(seq 1 30); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::宿主探活失败"
              docker compose ps
              docker compose logs --tail 100
              exit 1
            fi
            echo "health check passed"
            docker image prune -f
