name: Deploy backend

on:
  push:
    branches:
      - main

concurrency:
  group: task-backend-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # 用真实 Postgres 跑集成测试，确保持久化逻辑在部署前已被验证
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://taskuser:ci-only-password@127.0.0.1:5432/taskdb
      # main.py 在 import 时就会读取 API_KEY，缺失直接 raise RuntimeError，
      # 而下面的 "Verify application import" 一步会导入 main，所以这里必须给值。
      # 这是固定的 CI 假值，仅供 import 校验与 pytest 使用；
      # 生产密钥只存在于服务器的 .env，绝不写进 workflow。
      # （test_main.py 在 import main 之前会把这个值覆盖成 test-api-key。）
      API_KEY: ci-only-api-key

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify application import
        run: python -c "from main import app"

      - name: Run integration tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t task-backend:test .

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload project files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 显式白名单：只上传运行所需文件。
          #
          # 关于 H5 介绍页：
          #   deploy/h5.conf 是**版本化的静态配置文件**，随源码同步到服务器的
          #   /opt/task-backend/deploy/h5.conf。CI 只负责同步，**不安装**——
          #   安装是一个一次性的 root 动作：
          #       sudo bash deploy/install-h5-site.sh
          #   由人执行一次即可。之后改页面内容只需要 push：web/ 同步过去，
          #   nginx 直接读文件，无需 root、无需重跑安装脚本。
          #   不把 nginx 配置的安装放进 CI，是为了不保留任何常驻的 root 入口。
          #
          # 注意 source 里写的是目录名 `web`，不是 `web/*`：scp-action 传目录时
          # 会保留目录名，落到 /opt/task-backend/web/；写成 web/* 会把文件摊平到
          # /opt/task-backend/ 根下，nginx 的 root 就指不到 index.html 了。
          # deploy/ 下的脚本同理保留 deploy/ 这一层。
          source: "Dockerfile,compose.yml,main.py,db.py,requirements.txt,.dockerignore,deploy/setup-https.sh,deploy/install-h5-site.sh,deploy/h5.conf,web"
          target: "/opt/task-backend"
          overwrite: true

      - name: Build and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/task-backend
            touch .env
            # API_KEY 由服务器本地的 .env 维护，CI 既不生成也不覆盖，
            # 更不要把密钥写进本 workflow 或任何提交进仓库的文件。
            # 下面这段只负责补 POSTGRES_PASSWORD：缺失时随机生成一次并固化，
            # 之后每次部署都复用，不会冲掉 .env 里已有的 API_KEY 等条目。
            # 注意：首次部署前需人工在 .env 里加一行 API_KEY=<密钥>，
            # 否则 api 容器会因缺 API_KEY 拒绝启动（main.py 里显式 raise）。
            if ! grep -q '^POSTGRES_PASSWORD=' .env; then
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
              echo "POSTGRES_PASSWORD generated for first deploy"
            fi
            chmod 600 .env
            # --wait：由 compose 的健康检查判定就绪，失败时打印日志便于定位
            if ! docker compose up -d --build --remove-orphans --wait --wait-timeout 180; then
              echo "::error::服务未能进入健康状态"
              docker compose ps
              docker compose logs --tail 100
              exit 1
            fi
            # 从宿主再确认一次端口映射可用。不依赖 curl 的 --retry-all-errors，
            # 老版本 curl 不支持，且 --retry 不会重试 connection reset
            ok=0
            for _ in $(seq 1 30); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::宿主探活失败"
              docker compose ps
              docker compose logs --tail 100
              exit 1
            fi
            echo "health check passed"
            docker image prune -f
