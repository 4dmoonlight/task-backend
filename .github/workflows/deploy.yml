name: Deploy backend

on:
  push:
    branches:
      - main

concurrency:
  group: task-backend-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application import
        run: python -c "from main import app"

      - name: Build Docker image
        run: docker build -t task-backend:test .

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload project files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "Dockerfile,compose.yml,main.py,requirements.txt,.dockerignore"
          target: "/opt/task-backend"
          overwrite: true

      - name: Build and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/task-backend
            docker compose up -d --build --remove-orphans
            sleep 5
            curl --fail --retry 5 --retry-delay 2 \
              http://127.0.0.1:8000/health
            docker image prune -f
