# H5 介绍页站点配置（版本化文件，由仓库直接管理，不是模板）
#
# 安装：把本文件装到 /etc/nginx/conf.d/h5.conf，**只做一次**，见
#       deploy/install-h5-site.sh。
#
# 装完之后这份配置就定型了。日常改页面内容只需要更新 /opt/task-backend/web/，
# nginx 直接读文件，不用碰这里，也不用 root。
#
# 只有下面几种情况才需要改本文件并重新执行一次安装：
#   - 改域名（server_name）
#   - 改证书或私钥路径
#   - 改缓存策略、安全头、监听端口
#
# 与同目录 api.conf 的关系：
#   nginx.conf 里是 include /etc/nginx/conf.d/*.conf;，**按文件名排序**加载。
#   api.conf 排在 h5.conf 之前，因此它是 :80 与 :443 上的缺省站点：
#   未命中任何 server_name 的请求（例如直接用 IP 访问）仍然落到 FastAPI，
#   与安装本文件之前完全一致。
#   本文件刻意**不声明 default_server**：一是不改变既有行为，二是避免与
#   api.conf 将来可能添加的 default_server 冲突（同一 listen 上重复声明会让
#   nginx -t 直接失败）。
#
#   本机没有全局 IPv6 地址，api.conf 也只监听 IPv4，所以这里同样不写
#   listen [::]:80 / listen [::]:443，保持一致、减少 nginx -t 的失败面。

# ---------- HTTP：只做跳转，不提供内容 ----------
server {
    listen 80;
    server_name hahahahaha.party www.hahahahaha.party;

    return 301 https://$host$request_uri;
}

# ---------- HTTPS：静态介绍页 ----------
server {
    listen 443 ssl http2;
    server_name hahahahaha.party www.hahahahaha.party;

    # 复用 api 站点那张 Cloudflare Origin CA 证书：
    # SAN 已覆盖 *.hahahahaha.party 与 hahahahaha.party，根域与 www 都在内。
    ssl_certificate     /etc/nginx/ssl/api.hahahahaha.party.pem;
    ssl_certificate_key /etc/nginx/ssl/api.hahahahaha.party.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root  /opt/task-backend/web;
    index index.html;

    # 纯静态介绍页，页面里没有任何脚本：CSP 的 script-src 'none' 是有意为之。
    # nginx 的 add_header 只要本层出现过就不再继承上层，所以每个 location 里
    # 都重复声明这四个安全头（既定做法，不要合并到 server 块了事）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html 不写在这里：nginx 恒对它启用 gzip，重复声明会产生
    # "duplicate MIME type" 告警，让 nginx -t 的输出不干净。
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源：长缓存。
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf)$ {
        try_files $uri =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # 其余路径回落到入口页，任何入口都能看到介绍页。
    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
}
